name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: shanujans
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ca7938&color_dots=%230d1117,%231b2b3a,%232f5a86,%235299d2,%23ca7938
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ca7938&color_dots=%230d1117,%231b2b3a,%232f5a86,%235299d2,%23ca7938

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}